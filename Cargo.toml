[package]
name = "moqt-py"
version = "2026.0.0"
edition = "2024"
rust-version = "1.93"
description = "moqt-py is a Sans-IO MOQT/LOC/MSF/C4M library with a WebTransport/QUIC client, using moqt-rs."
readme = "README.md"
repository = "https://github.com/shiguredo/moqt-py"
license = "Apache-2.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# Python バインディングと型スタブ生成用の introspection
pyo3 = { version = "0.29", features = ["extension-module", "experimental-inspect"] }
# MOQT の Sans I/O codec とセッション状態機械
# 公開リポジトリにタグ付けされたリリースがまだ存在しないため develop ブランチを
# 追従する。実際にビルドしたコミットは Cargo.lock が固定する。最新へ更新するときは
# `cargo update -p shiguredo_moqt` を実行する。リリースタグが作成されたら tag 指定へ
# 切り替える
#
# C4M (moqt.c4m) の署名 / 検証は aws-lc-rs に固定する。moqt-rs では optional feature
# であり、no_std ターゲットではビルドできないが、moqt-py は std 環境だけを対象とする
# ため常に有効にする
shiguredo_moqt = { git = "https://github.com/shiguredo/moqt-rs.git", branch = "develop", features = [
  "aws-lc-rs",
] }
